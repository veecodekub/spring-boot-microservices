server:
  port: 8080

spring:
  application:
    name: api-gateway-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9090/realms/microservices/protocol/openid-connect/certs
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:9090/realms/microservices
            user-name-attribute: preferred_username
        registration:
          keycloak:
            provider: keycloak
            client-id: spring-gateway-client
            client-secret: Jn6rD7Bgbt5ecG9iT6IEw7jF1P1Nft33
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*" # Allows all headers
                allowCredentials: true

logging:
  level:
    root: INFO
    "[org.springframework.web]": INFO
