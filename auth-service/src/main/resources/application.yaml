server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_service
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

jwt:
  issuer: auth-service
  secret-key: ff92ca3955b73dacd9afa57a71825bab9f27bea84467afc3bae363209b3c6929
  expiration: 86400000

keycloak:
  auth-server-url: http://localhost:9090
  admin-realm: master
  admin-client-id: admin-cli
  admin-username: admin
  admin-password: admin

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0
    description: Authentication Service

eureka:
  client:
    enabled: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    preferIpAddress: true

logging:
  level:
    root: INFO
    "[org.springframework.web]": INFO
    "[dev.veecodekub.authservice]": DEBUG
    "[org.keycloak.admin.client]": DEBUG
